services:
  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=api
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  server2:
      container_name: api2
      build:
        context: .
        dockerfile: Dockerfile
      restart: unless-stopped
      env_file: .env
      environment:
        - SERVICE_NAME=api
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - PORT=5000
      ports:
        - "5001:5000"
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - internal
      healthcheck:
        test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
        interval: 15s
        timeout: 5s
        retries: 5
        start_period: 10s
  worker-click:
    container_name: worker-click
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/workers/clickWorker.js"]
    env_file: .env
    environment:
      - SERVICE_NAME=worker-click
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  worker-email:
    container_name: worker-email
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/workers/emailWorker.js"]
    env_file: .env
    environment:
      - SERVICE_NAME=worker-email
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  cron:
    container_name: cron
    build:
      context: .
      dockerfile: Dockerfile.cron
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=cron
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
  vector:
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
    environment:
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      AXIOM_DATASET: ${AXIOM_DATASET}
    depends_on:
      - server
      - server2
      - worker-click
      - worker-email
      - cron
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
