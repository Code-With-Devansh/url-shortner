services:
  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=api
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    volumes:
      - geoip_data:/usr/src/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  server2:
      container_name: api2
      build:
        context: .
        dockerfile: Dockerfile
      restart: unless-stopped
      env_file: .env
      environment:
        - SERVICE_NAME=api
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - PORT=5000
      volumes:
        - geoip_data:/usr/src/app/data

      ports:
        - "5001:5000"
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - internal
      healthcheck:
        test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
        interval: 15s
        timeout: 5s
        retries: 5
        start_period: 10s
  worker-click:
    container_name: worker-click
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/workers/clickWorker.js"]
    env_file: .env
    environment:
      - SERVICE_NAME=worker-click
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - geoip_data:/usr/src/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  worker-email:
    container_name: worker-email
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/workers/emailWorker.js"]
    env_file: .env
    environment:
      - SERVICE_NAME=worker-email
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  cron:
    container_name: cron
    build:
      context: .
      dockerfile: Dockerfile.cron
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=cron
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - geoip_data:/usr/src/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
  vector:
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      - server
      - server2
      - worker-click
      - worker-email
      - cron
      - loki
    networks:
      - internal

  loki:
    container_name: loki
    image: grafana/loki:latest
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    networks:
      - internal
    # Not published to the host on purpose - only Vector (Loki client) and
    # Grafana (Loki datasource) need to reach it, and both are on the
    # internal network already.

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - internal
    ports:
      # Bound to loopback only - reachable from the EC2 box itself (e.g. for
      # debugging with an SSH tunnel) but never exposed to the internet.
      - "127.0.0.1:9090:9090"

  grafana:
    container_name: grafana
    image: grafana/grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - internal
    ports:
      # Bound to loopback only - host nginx proxies to this from outside.
      - "127.0.0.1:3001:3000"
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
    - internal
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
networks:
  internal:
    driver: bridge

volumes:
  redis_data:
  geoip_data:
  loki_data:
  prometheus_data:
  grafana_data: