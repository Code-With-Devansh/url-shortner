
sources:
  docker_logs:
    type: docker_logs
    include_containers:
      - api
      - api2
      - worker-click
      - worker-email
      - cron            

# ---- PARSE & ENRICH ----
transforms:
  parse_json:
    type: remap
    inputs:
      - docker_logs
    source: |
      . = parse_json!(.message)
      .host = get_hostname!()


sinks:
  loki:
    type: loki
    inputs:
      - parse_json
    endpoint: "http://loki:3100"
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    labels:
      service: "{{ service }}"
      host: "{{ host }}"

  console:
    type: console
    inputs:
      - parse_json
    encoding:
      codec: json